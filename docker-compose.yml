services:
  plane-pachka:
    image: ghcr.io/swoisteam/devflow-bridge:latest
    build: .
    container_name: devflow-bridge
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3342}:3342"
    volumes:
      - ./config:/app/config:ro
    env_file:
      - .env
    environment:
      PORT: 3342
